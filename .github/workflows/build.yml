name: Build Android APK & Release

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build & Publish Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Make Gradle Wrapper Executable
        run: chmod +x gradlew

      - name: Extract Version Info
        run: python3 tools/extract_version.py

      - name: Build Release APK
        run: ./gradlew assembleRelease

      - name: Prepare Assets, Release Notes and version.json
        run: |
          mkdir -p dist
          APK_PATH=$(find app/build/outputs/apk/release -name "*.apk" | head -n 1)
          cp "$APK_PATH" "dist/myiptv-${VERSION_NAME}.apk"
          cat <<EOF > dist/version.json
          {
            "version_code": ${VERSION_CODE},
            "version_name": "${VERSION_NAME}",
            "apk_name": "myiptv-${VERSION_NAME}.apk",
            "apk_url": "https://github.com/liumeng1201/myiptv/releases/download/${TAG_NAME}/myiptv-${VERSION_NAME}.apk"
          }
          EOF
          gh api "repos/${GITHUB_REPOSITORY}/releases/generate-notes" -f tag_name="${TAG_NAME}" --jq .body > dist/release_notes.md || true
          if [ ! -s dist/release_notes.md ]; then
            echo "**Full Changelog**: https://github.com/${GITHUB_REPOSITORY}/commits/${TAG_NAME}" > dist/release_notes.md
          fi
          cat dist/version.json
          ls -lh dist/
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: myiptv-release-${{ env.VERSION_NAME }}
          path: |
            dist/myiptv-${{ env.VERSION_NAME }}.apk
            dist/version.json
          retention-days: 30

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG_NAME }}
          name: 看电视 ${{ env.TAG_NAME }}
          body_path: dist/release_notes.md
          files: |
            dist/myiptv-${{ env.VERSION_NAME }}.apk
            dist/version.json
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
